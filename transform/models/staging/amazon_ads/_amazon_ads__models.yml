version: 2

models:
  - name: stg_amazon_ads__profiles
    description: One row per advertiser profile, from its latest snapshot.
    columns:
      - name: profile_id
        data_tests: [unique, not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: [NA, EU, FE]
      - name: account_type
        data_tests:
          - accepted_values:
              arguments:
                values: [seller, vendor, agency]

  - name: stg_amazon_ads__sp_campaign_daily
    description: One row per Sponsored Products campaign per day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [profile_id, campaign_id, date_day]
    columns:
      - name: profile_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]
      - name: date_day
        data_tests: [not_null]
      - name: campaign_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ENABLED, PAUSED, ARCHIVED]
      - name: cost
        data_tests: [not_null]

  - name: stg_amazon_ads__sp_advertised_product_daily
    description: One row per product ad per day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [profile_id, ad_id, date_day]
    columns:
      - name: ad_id
        data_tests: [not_null]
      - name: date_day
        data_tests: [not_null]
      - name: advertised_asin
        data_tests: [not_null]
      - name: cost
        data_tests: [not_null]
