[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ads-reports-dbt"
version = "1.0.0"
description = "Amazon Ads API v3 Sponsored Products reports to BigQuery, with a tested dbt project."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arminas Attas" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<0.29",
    "google-cloud-bigquery>=3.40,<4",
    # zoneinfo needs a time zone database; not every image ships one (Windows, Alpine).
    "tzdata>=2025.2",
]

[project.optional-dependencies]
# Local runs and the test suite: DuckDB stands in for BigQuery.
dev = [
    "duckdb>=1.5,<2",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "sqlglot>=30,<31",
]
# Production transform step. sqlglot is only used by `make bigquery-check`.
prod = [
    "dbt-core>=1.12,<1.13",
    "dbt-bigquery>=1.12,<1.13",
    "sqlglot>=30,<31",
]

[project.scripts]
amazon-ads-pipeline = "amazon_ads_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["dbt: builds the dbt project against DuckDB (slower)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["amazon_ads_pipeline"]
known-local-folder = ["support"]
