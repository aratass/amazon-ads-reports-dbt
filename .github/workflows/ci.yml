name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Lint, pytest (including the dbt sabotage tests), then replay + dbt build on DuckDB.
      - run: make test
